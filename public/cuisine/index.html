<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Écran Cuisine — Bella Pizza</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   KITCHEN DASHBOARD — NIGHT SHIFT (OPERATIONAL HIGH-CONTRAST DISPLAY)
   - Background:    #100E0D
   - Order Tickets: #24211F
   - Text:          #FFFFFF
   - Brand Accent:  #A52A2A
   - Border:        #36322F
   ========================================================================== */

:root{
  --bg:#100E0D;
  --ticket:#24211F;
  --ticket-inner:#1B1917;
  --white:#FFFFFF;
  --text:#FFFFFF;
  --mute:#A19891;
  --line:#36322F;
  --red:#A52A2A;
  --red-hover:#852222;
  --amber:#F59E0B;
  --amber-bg:rgba(245, 158, 11, 0.15);
  --green:#10B981;
  --green-bg:rgba(16, 185, 129, 0.15);
  --blue:#3B82F6;
  --blue-bg:rgba(59, 130, 246, 0.15);
  --font:'General Sans', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font:15px/1.4 var(--font);
  background:var(--bg) !important;
  color:var(--white) !important;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}

/* Header bar */
header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  gap:16px;
  align-items:center;
  justify-content:space-between;
  padding:14px 24px;
  background:#181513 !important;
  border-bottom:1.5px solid var(--line) !important;
}

header h1{
  font:800 20px var(--font);
  letter-spacing:-0.02em;
  color:#FFFFFF !important;
  display:flex;
  align-items:center;
}
header h1 span{
  color:var(--red) !important;
  margin-left:6px;
}
.st{
  font-size:12px;
  font-weight:600;
  color:var(--mute);
  margin-top:2px;
}

/* Buttons */
.btn{
  font:700 14px var(--font);
  border:1px solid transparent;
  border-radius:8px;
  padding:10px 18px;
  cursor:pointer;
  transition:all 0.15s ease;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-decoration:none;
}
.btn:active{transform:scale(0.97)}
.btn.red{
  background:var(--red) !important;
  color:#FFFFFF !important;
  border-color:var(--red) !important;
}
.btn.red:hover{
  background:var(--red-hover) !important;
}
.btn.ink{
  background:#36322F !important;
  color:#FFFFFF !important;
  border-color:var(--line) !important;
}
.btn.ink:hover{
  background:#48433F !important;
}
.btn.ok{
  background:#10B981 !important;
  color:#FFFFFF !important;
}
.btn.ok:hover{
  background:#059669 !important;
}
.btn.ghost{
  background:transparent !important;
  border:1px solid var(--line) !important;
  color:var(--white) !important;
}
.btn.ghost:hover{
  background:rgba(255,255,255,0.06) !important;
}

/* Password Gate */
#gate{
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(16, 14, 13, 0.95);
  display:grid;
  place-items:center;
  padding:24px;
}
#f{
  background:var(--ticket) !important;
  padding:40px 36px;
  border-radius:16px;
  border:1px solid var(--line) !important;
  box-shadow:0 24px 60px rgba(0,0,0,0.6) !important;
  text-align:center;
  max-width:420px;
  width:100%;
}
#f h1{
  font:800 26px var(--font);
  color:#FFFFFF;
  margin-bottom:8px;
}
#f h1 span{
  color:var(--red);
}
#f p{
  color:var(--mute);
  font-size:14px;
  margin-bottom:24px;
}
#pw{
  display:block;
  margin:0 auto 12px;
  font:600 16px var(--font);
  padding:12px 18px;
  border-radius:8px;
  border:1.5px solid var(--line);
  background:var(--ticket-inner);
  color:#FFFFFF;
  width:100%;
  text-align:center;
}
#pw:focus{
  outline:none;
  border-color:var(--red);
}
#er{
  color:#EF4444;
  min-height:22px;
  margin-bottom:12px;
  font-weight:700;
  font-size:13px;
}
#go{
  width:100%;
  padding:14px;
  font-size:15px;
}

/* Kitchen Ticket Grid */
main#list{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(360px, 1fr));
  gap:20px;
  padding:24px;
}

/* Order Ticket Card */
.o{
  background:var(--ticket) !important;
  border:2px solid var(--line) !important;
  border-radius:14px !important;
  padding:20px !important;
  display:flex !important;
  flex-direction:column !important;
  gap:16px !important;
  box-shadow:0 8px 24px rgba(0, 0, 0, 0.4) !important;
  transition:all 0.2s ease !important;
}

/* State: New order (flashing red accent) */
.o.new{
  border-color:var(--red) !important;
  box-shadow:0 0 20px rgba(165, 42, 42, 0.45) !important;
  animation:kdsPulse 2s infinite !important;
}
@keyframes kdsPulse{
  0%, 100%{ border-color:var(--red); }
  50%{ border-color:#EF4444; box-shadow:0 0 28px rgba(239, 68, 68, 0.6); }
}

/* State: In preparation */
.o.accepted{
  border-color:var(--amber) !important;
}

/* State: Ready */
.o.ready{
  border-color:var(--green) !important;
}

/* Ticket Top Header */
.top{
  display:flex !important;
  justify-content:space-between !important;
  align-items:flex-start !important;
}
.top b{
  font:800 36px var(--font) !important;
  letter-spacing:-0.03em !important;
  color:#FFFFFF !important;
  line-height:1 !important;
}
.top span{
  font:700 16px var(--font) !important;
  color:var(--amber) !important;
  display:flex !important;
  align-items:center !important;
  gap:6px !important;
}

/* Order Mode & Payment Badges */
.tags{
  display:flex !important;
  gap:8px !important;
  flex-wrap:wrap !important;
}
.tag{
  display:inline-flex !important;
  padding:6px 12px !important;
  border-radius:6px !important;
  font:800 12.5px var(--font) !important;
  text-transform:uppercase !important;
  letter-spacing:0.06em !important;
}

/* Mode: À emporter */
.tag.mod{
  background:#1E293B !important;
  color:#93C5FD !important;
  border:1px solid #3B82F6 !important;
}

/* Payment Status */
.tag.pay{
  background:var(--green-bg) !important;
  color:#34D399 !important;
  border:1px solid #10B981 !important;
}
.tag.due{
  background:rgba(239, 68, 68, 0.15) !important;
  color:#FCA5A5 !important;
  border:1px solid #EF4444 !important;
}

/* Items List */
ul{
  list-style:none !important;
  padding:12px 14px !important;
  margin:0 !important;
  background:var(--ticket-inner) !important;
  border-radius:10px !important;
  border:1px solid var(--line) !important;
}
li{
  padding:10px 0 !important;
  border-bottom:1px solid rgba(255,255,255,0.08) !important;
  display:flex !important;
  align-items:flex-start !important;
  gap:12px !important;
}
li:last-child{
  border:0 !important;
}
li b{
  font-weight:900 !important;
  color:#F87171 !important;
  font-size:20px !important;
  min-width:28px !important;
  line-height:1.2 !important;
}
li div{
  flex:1 !important;
}
li div > span, li div > strong{
  font-size:16.5px !important;
  font-weight:700 !important;
  color:#FFFFFF !important;
  line-height:1.3 !important;
}
li i{
  display:block !important;
  font:700 13px var(--font) !important;
  color:#FDE047 !important;
  margin-top:6px !important;
  font-style:normal !important;
  background:#362818 !important;
  border:1px solid #CA8A04 !important;
  padding:4px 9px !important;
  border-radius:6px !important;
  width:fit-content !important;
}

/* Customer & Table details */
.cust{
  background:var(--ticket-inner) !important;
  padding:12px 14px !important;
  border-radius:10px !important;
  border:1px solid var(--line) !important;
  font-size:13.5px !important;
  line-height:1.5 !important;
  color:var(--mute) !important;
}
.cust b{
  font-size:15px !important;
  font-weight:700 !important;
  color:#FFFFFF !important;
}

/* Instructions / Allergy Note */
.note{
  padding:12px 14px !important;
  border-radius:8px !important;
  background:#3E2914 !important;
  border:1.5px solid #F59E0B !important;
  color:#FEF3C7 !important;
  font-weight:700 !important;
  font-size:14px !important;
}

/* Action Buttons Footer */
.acts{
  display:flex !important;
  gap:10px !important;
  margin-top:auto !important;
  padding-top:6px !important;
}
.acts .btn{
  flex:1 !important;
  min-height:50px !important;
  font-size:15px !important;
  font-weight:800 !important;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:140px 20px;
  color:var(--mute);
  font:700 24px var(--font);
  letter-spacing:-0.02em;
}

#ticket{display:none}

@media print{
  @page{size:80mm auto;margin:0}
  body>*:not(#ticket){display:none!important}
  #ticket{display:block;width:72mm;margin:0 auto;padding:4mm 0;font:13px/1.35 'Courier New',monospace;color:#000;background:#fff}
  #ticket h2{font-size:22px;text-align:center}
  #ticket hr{border:0;border-top:1px dashed #000;margin:6px 0}
  #ticket .l{display:flex;justify-content:space-between;gap:8px}
  #ticket .big{font-size:16px;font-weight:700}
  #ticket .c{text-align:center}
}

@media (max-width: 768px){
  main#list{
    grid-template-columns:1fr;
    padding:16px;
    gap:16px;
  }
  .acts{
    flex-direction:column;
  }
}
</style></head><!-- Écran cuisine --><body>
<div id="gate"><form id="f"><h1>Écran<span>Cuisine</span></h1><p><b>Gestion des commandes en direct</b><br>Entrez le mot de passe, touchez pour activer le son et mettez le volume au maximum.</p><input id="pw" type="password" autocomplete="current-password" placeholder="Mot de passe" required><div id="er"></div><button id="go" class="btn red">Se connecter et activer le son</button></form></div>
<header><div><h1>Écran <span>Cuisine</span></h1><div class="st" id="st">connexion…</div></div><div style="display:flex;gap:8px;align-items:center"><button class="btn ghost" id="autoprint-btn">🖨️ Auto-impression: OFF</button> <button class="btn ink" id="mute">Couper l’alarme</button></div></header>
<main id="list"></main>
<div id="ticket"></div>
<script>
const $=s=>document.querySelector(s),eur=c=>(c/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
let orders=new Map(),ctx,muted=false,autoPrint=false,timer,key='',printedSet=new Set(),printQueue=[]
let restaurantName='Restaurant'
fetch('/api/config').then(r=>r.ok?r.json():null).then(d=>{
 if(d?.restaurant?.brand?.name){
  restaurantName=d.restaurant.brand.name
  document.title='Cuisine — '+restaurantName
  const hGate=$('#f h1');if(hGate)hGate.textContent=restaurantName
  const hHead=$('header h1');if(hHead)hHead.textContent=restaurantName+' Cuisine'
 }
 if(d?.restaurant?.brand?.logoUrl){
  const hHead=$('header h1');if(hHead&&!$('header h1 img')){const img=document.createElement('img');img.src=d.restaurant.brand.logoUrl;img.alt=restaurantName;img.style.cssText='height:30px;width:auto;border-radius:6px;object-fit:contain;vertical-align:middle;margin-right:10px;';hHead.prepend(img)}
 }
 if(d?.restaurant?.theme?.primaryColor){
  document.documentElement.style.setProperty('--red',d.restaurant.theme.primaryColor)
 }
 if(d?.restaurant?.theme?.primaryHover){
  document.documentElement.style.setProperty('--red2',d.restaurant.theme.primaryHover)
 }
}).catch(()=>{})
const time=t=>{try{const d=new Date(t);return isNaN(d.getTime())?'--:--':d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'})}catch{return '--:--'}}
// ----- Restaurant service bell / counter bell chime ("Ding! Ding!") -----
function chime(t,freq=2093,vol=.8){
 const partials=[{ratio:.5,gain:.12,decay:1.4},{ratio:1,gain:.85,decay:2.2},{ratio:1.586,gain:.38,decay:1},{ratio:2.713,gain:.24,decay:.6},{ratio:4.18,gain:.14,decay:.3},{ratio:6.25,gain:.09,decay:.08}]
 partials.forEach(p=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq*p.ratio,t);g.gain.setValueAtTime(vol*p.gain,t);g.gain.exponentialRampToValueAtTime(0.0001,t+p.decay);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+p.decay+.05)})
}
function ring(){
 if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch{}}
 if(!ctx)return
 if(ctx.state==='suspended')ctx.resume()
 const t=ctx.currentTime+.02; chime(t,2093,.7); chime(t+.35,2093,.85)
}
const unlockAudio=()=>{try{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx&&ctx.state==='suspended')ctx.resume()}catch{}}
;['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}))
function alarm(){const has=[...orders.values()].some(o=>o.status==='new');if(has&&!muted){if(!timer){ring();timer=setInterval(ring,3600)}}else{clearInterval(timer);timer=null}}
function getOrderData(o){
 let items=o.items,cust=o.customer
 if(typeof items==='string'){try{items=JSON.parse(items)}catch{items=[]}}
 if(typeof cust==='string'){try{cust=JSON.parse(cust)}catch{cust={}}}
 return {items:Array.isArray(items)?items:[],cust:cust||{}}
}
const typeLabel=o=>o.type==='livraison'?'LIVRAISON':o.type==='sur_place'?(o.tableNumber?`SUR PLACE (Table ${esc(o.tableNumber)})`:'SUR PLACE'):'À EMPORTER'
const typeClass=t=>t==='livraison'?'mod':t==='sur_place'?'sp':'mod'
// ----- print 80mm ticket -----
// NOTE: function is named printTicket (not print) to avoid shadowing window.print()
function printTicket(o){
 try{
  if(!o)return
  const {items,cust}=getOrderData(o)
  const slotM = (o.note||'').match(/\[Heure souhaitée:\s*([^\]]+)\]/i)
  const slotBadge = slotM ? `<span class="tag" style="background:#fef3c7;color:#92400e;border:1px solid #fde68a;font-weight:900">⏰ POUR ${esc(slotM[1])}</span>` : ''
  const lines=items.map(l=>`<div class="l big"><span>${l.qty||1} × ${esc(l.name)}</span><span>${eur((l.price||0)*(l.qty||1))}</span></div>${l.note?`<div>   ↳ ${esc(l.note)}</div>`:''}`).join('')
  $('#ticket').innerHTML=`<h2>${esc(restaurantName.toUpperCase())}</h2><div class="c">Commande n° ${o.number||''} · ${time(o.createdAt)}</div><hr><div class="big c">${typeLabel(o)}${o.tableNumber?`<br>TABLE N° ${esc(o.tableNumber)}`:''}</div><hr>${lines}<hr>${o.discount>0?`<div class="l"><span>Réduction</span><span>-${eur(o.discount)}</span></div>`:''}<div class="l big"><span>TOTAL</span><span>${eur(o.total||0)}</span></div><div class="c big">${o.paid?'PAYÉ EN LIGNE':'À ENCAISSER ('+typeLabel(o)+')'}</div><hr><div>${esc(cust.name)}<br>Tél ${esc(cust.phone)}${o.type==='livraison'?`<br>${esc(cust.address)}<br>${esc(cust.postcode)}`:''}</div>${o.note?`<hr><div>Note : ${esc(o.note)}</div>`:''}<hr><div class="c">⭐ Merci de votre commande !<br>Laissez-nous 5★ sur Google Maps !</div>`
  window.print()
 }catch(err){
  console.error('[Print Error]',err)
  alert('Erreur lors de l\'impression : '+err.message)
 }
}
// Drain the auto-print queue one ticket at a time (500ms apart so the print dialog can close)
let draining=false
function drainPrintQueue(){
 if(draining||!printQueue.length)return
 draining=true
 const o=printQueue.shift()
 printTicket(o)
 setTimeout(()=>{draining=false;drainPrintQueue()},500)
}
// ----- UI -----
function render(){
 const L=[...orders.values()].filter(o=>o.status!=='done').sort((a,b)=>a.createdAt-b.createdAt)
 $('#list').innerHTML=L.length?L.map(o=>{
  const {items,cust}=getOrderData(o)
  const slotM = (o.note||'').match(/\[Heure souhaitée:\s*([^\]]+)\]/i)
  const slotBadge = slotM ? `<span class="tag" style="background:#fef3c7;color:#92400e;border:1px solid #fde68a;font-weight:900">⏰ POUR ${esc(slotM[1])}</span>` : ''
  const cleanP=(cust.phone||'').replace(/\D/g,'')
  const waP=cleanP.startsWith('0')?'33'+cleanP.slice(1):cleanP
  const waMsg=encodeURIComponent(`Bonjour ${cust.name||''}, votre commande #${o.number} de ${restaurantName} est en cours de préparation / prête !`)
  const waBtn=waP.length>=9?`<a href="https://wa.me/${waP}?text=${waMsg}" target="_blank" class="btn-wa" style="display:inline-flex;align-items:center;gap:4px;background:#25D366;color:#fff;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:700;text-decoration:none;margin-left:8px" title="Envoyer un WhatsApp">💬 WhatsApp</a>`:''
  return `<article class="o ${o.status}" data-id="${o.id}">
  <div class="top"><b>#${o.number}</b><span>${time(o.createdAt)}</span></div>
  <div class="tags"><span class="tag ${typeClass(o.type)}">${typeLabel(o)}</span>${slotBadge}<span class="tag ${o.paid?'pay':'due'}">${o.paid?'PAYÉ EN LIGNE':'À ENCAISSER '+eur(o.total||0)}</span></div>
  <ul>${items.map(l=>`<li><b>${l.qty||1}</b> <div><span>${esc(l.name)}</span>${l.note?`<i>↳ ${esc(l.note)}</i>`:''}</div></li>`).join('')}</ul>
  ${o.discount>0?`<div style="font-size:13px;color:var(--green);font-weight:700">🏷️ Code promo appliqué (-${eur(o.discount)})</div>`:''}
  ${o.note?`<div class="note">💬 ${esc(o.note)}</div>`:''}
  <div class="cust"><b>${esc(cust.name)}</b> · <a href="tel:${esc(cust.phone)}">${esc(cust.phone)}</a>${waBtn}${o.type==='livraison'?`<br>${esc(cust.address)}<br>${esc(cust.postcode)}`:''}</div>
  <div class="acts">${o.status==='new'?'<button data-s="accepted" class="btn red">Accepter la commande</button>':o.status==='accepted'?'<button data-s="ready" class="btn ink">Prête</button>':'<button data-s="done" class="btn ok">Remise / livrée</button>'}<button class="btn ghost" data-p="1" aria-label="Imprimer le ticket" style="flex:none;width:52px;padding:0">🖨</button></div></article>`
 }).join(''):'<div class="empty">Pas de commandes en cours 🎉</div>'
 alarm()}
$('#list').onclick=async e=>{
 const b=e.target.closest('button');if(!b)return;
 const art=b.closest('.o');if(!art)return;
 const o=orders.get(art.dataset.id);
 if(b.dataset.p){
  if(o){printTicket(o)}else{alert('Commande introuvable')}
  return
 }
 if(!o)return;
 const r=await api('',{method:'POST',body:JSON.stringify({id:o.id,status:b.dataset.s})});if(r.ok){orders.set(o.id,await r.json());render()}else load()}
const api=(p,o={})=>fetch('/api/kitchen'+p,{...o,headers:{'x-kitchen-key':key,'content-type':'application/json'}})
document.addEventListener('visibilitychange',()=>{if(!document.hidden)navigator.wakeLock?.request('screen').catch(()=>{})})
$('#mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'Réactiver l\'alarme':'Couper l\'alarme';alarm()}
$('#autoprint-btn').onclick=e=>{
 autoPrint=!autoPrint
 e.target.textContent=autoPrint?'🖨️ Auto-impression: ON':'🖨️ Auto-impression: OFF'
 e.target.className='btn '+(autoPrint?'ok':'ghost')
}
async function load(){try{const r=await api('');if(r.status===401){localStorage.removeItem('tp_cuisine_key');sessionStorage.removeItem('k');location.reload();return}
 const j=await r.json();orders=new Map(j.orders.map(o=>[o.id,o]));render();
 if(autoPrint){for(const o of orders.values()){if(o.status==='new'&&!printedSet.has(o.id)){printedSet.add(o.id);printQueue.push(o)}}; drainPrintQueue()}
 if(j.dbError){console.error('[Database Error]',j.dbError);$('#st').innerHTML=`<span style="color:var(--red);font-weight:700" title="${esc(j.dbError)}">⚠️ BD : ${esc(j.dbError)}</span>`}
 else{$('#st').textContent='Connecté · '+time(Date.now())}}catch(err){console.error('Kitchen error:',err);$('#st').textContent='Erreur : '+(err.message||'connexion perdue')}}
$('#f').onsubmit=async e=>{e.preventDefault();key=$('#pw').value
 ctx=new(window.AudioContext||window.webkitAudioContext)();ring()
 const r=await api('');if(r.status===401){$('#er').textContent='Mot de passe incorrect';return}
 localStorage.setItem('tp_cuisine_key',key);sessionStorage.setItem('k',key);$('#gate').remove();navigator.wakeLock?.request('screen').catch(()=>{});load();setInterval(load,3000)}

const urlTok=new URLSearchParams(location.search).get('token')
const savedKey=urlTok||localStorage.getItem('tp_cuisine_key')||sessionStorage.getItem('k')
if(savedKey){
 key=savedKey;localStorage.setItem('tp_cuisine_key',key);if(urlTok)history.replaceState(null,'',location.pathname)
 $('#gate')?.remove();navigator.wakeLock?.request('screen').catch(()=>{});load();setInterval(load,3000)
}
</script></body></html>
